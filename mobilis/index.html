<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobilis in Mobili</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0d1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mobilis in Mobili — Captain Nemo: A Journey Within. Gallinello Games.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="setup" class="screen">
    <div class="hero">
      <img src="img/back.jpg" alt="Mobilis in Mobili">
      <div class="hero-txt"><div class="sub">Captain Nemo: A Journey Within</div></div>
    </div>
    <div class="panel">
      <div class="seg" id="modeSeg">
        <button data-m="multi" class="on">Contro AI</button>
        <button data-m="team">4 a squadre</button>
        <button data-m="solo">Solitario</button>
      </div>
      <div id="seats"></div>
      <button id="addSeat" class="ghost">+ Aggiungi giocatore</button>
      <button id="startBtn" class="primary">Salpa</button>
      <button id="resumeBtn" class="ghost hidden">Continua la partita salvata</button>
      <button id="rulesBtn0" class="ghost">Regole in breve</button>
      <p class="fine">A game by Giovanni Colombi, with art by Sam Ristola · Gallinello Games · prototipo di playtest</p>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header id="top"><div id="status"></div><button id="menuBtn" class="icon" aria-label="Menu">☰</button></header>
    <div id="players"></div>
    <div id="prompt"><div id="promptText"></div><div id="promptBtns"></div><div id="miniLog"></div></div>
    <h2 class="sec">Mare delle Memorie</h2>
    <div id="seaWrap"><div id="sea"></div></div>
    <h2 class="sec">Nautilus <span id="powerHint"></span></h2>
    <div id="nautWrap"><img src="img/nautilus.jpg" alt="Plancia del Nautilus" id="nautImg"><div id="naut"></div></div>
    <h2 class="sec">Equilibrio della mente di Nemo</h2>
    <div id="eqWrap"><img src="img/equilibrium.jpg" alt="Plancia dell'Equilibrio"><div id="eq"></div></div>
    <div class="spacer"></div>
  </section>

  <div id="sheet" class="hidden"><div class="sheet-bg"></div><div class="sheet-body"><div id="sheetContent"></div></div></div>
  <div id="toasts"></div>
</div>
<script src="cards.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
